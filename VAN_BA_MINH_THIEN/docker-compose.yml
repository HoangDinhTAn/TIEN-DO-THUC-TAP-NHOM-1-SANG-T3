services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: huong
      POSTGRES_USER: huong
      POSTGRES_PASSWORD: huong_dev
    ports:
      - "5432:5432"
    volumes:
      - huong-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huong -d huong"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  huong-postgres:
